name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check version and extract notes
        run: node scripts/check.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Package the plugin
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=subagent-arena/ -o "dist/subagent-arena-${GITHUB_REF_NAME}.zip" HEAD \
            .claude-plugin hooks types tsconfig.json README.md LICENSE CHANGELOG.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/subagent-arena-${GITHUB_REF_NAME}.zip" \
            --title "Claude Arena ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
