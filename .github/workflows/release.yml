name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check version and extract notes
        run: node scripts/check.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Package the plugin
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=subagent-arena/ -o "dist/subagent-arena-${GITHUB_REF_NAME}.zip" HEAD \
            .claude-plugin hooks types tsconfig.json README.md LICENSE CHANGELOG.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/subagent-arena-${GITHUB_REF_NAME}.zip" \
            --title "Claude Arena ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
